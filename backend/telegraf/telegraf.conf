[agent]
  interval = "1s"
  flush_interval = "1s"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "tfg"
  bucket = "telemetria"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["tfg/fran/telemetria"]
  data_format = "json"
